<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <rect x="80" y="60" width="1440" height="4" fill="url(#accent)"/>
  <text x="80" y="115" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#00d4ff" font-weight="bold" letter-spacing="3">ELECTROMAGNETIC THEORY &amp; INTERFERENCE · SLIDE 5 OF 5</text>
  <text x="80" y="185" font-family="'Space Grotesk', sans-serif" font-size="60" fill="#ffffff" font-weight="800">How to Reduce EMI</text>
  <text x="640" y="185" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#94a3b8" font-weight="500">— The Three Pillars of EMC</text>

  <!-- 3 Reduction Pillars -->
  <!-- 1. Grounding -->
  <rect x="80" y="240" width="460" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <circle cx="160" cy="320" r="40" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2"/>
  <line x1="160" y1="300" x2="160" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <line x1="140" y1="330" x2="180" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <line x1="148" y1="337" x2="172" y2="337" stroke="#38bdf8" stroke-width="3"/>
  <line x1="154" y1="344" x2="166" y2="344" stroke="#38bdf8" stroke-width="3"/>
  <text x="220" y="325" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#ffffff" font-weight="700">1. Grounding</text>
  <text x="120" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#38bdf8" font-weight="600">Zero-Potential Sink</text>
  <text x="120" y="450" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Sends unwanted current safely to ground.</text>
  <text x="120" y="500" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Ground establishes a zero-potential reference point.</text>
  <text x="120" y="560" font-family="'Inter', sans-serif" font-size="19" fill="#94a3b8">• Eliminates ground loops and return path impedance.</text>

  <!-- 2. Shielding -->
  <rect x="570" y="240" width="460" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <circle cx="650" cy="320" r="40" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="2"/>
  <path d="M650 300 L670 310 L670 330 Q650 345 650 345 Q630 330 630 310 Z" fill="none" stroke="#00d4ff" stroke-width="2.5"/>
  <text x="710" y="325" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#ffffff" font-weight="700">2. Shielding</text>
  <text x="610" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#00d4ff" font-weight="600">Faraday Barriers</text>
  <text x="610" y="450" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Keeps noise inside, or stops it from entering.</text>
  <text x="610" y="500" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Implemented with metal boxes, partitions &amp; braided cable shields.</text>
  <text x="610" y="570" font-family="'Inter', sans-serif" font-size="19" fill="#94a3b8">• Reflects and absorbs incident RF waves.</text>

  <!-- 3. Filtering -->
  <rect x="1060" y="240" width="460" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>
  <circle cx="1140" cy="320" r="40" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="2"/>
  <path d="M1125 305 L1155 305 L1145 325 L1145 340 L1135 340 L1135 325 Z" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="1200" y="325" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#ffffff" font-weight="700">3. Filtering</text>
  <text x="1100" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#f59e0b" font-weight="600">Frequency Selectivity</text>
  <text x="1100" y="450" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Blocks unwanted high frequencies and lets DC/signals pass.</text>
  <text x="1100" y="510" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Low-pass LC filters and ferrite chokes are commonly used.</text>
  <text x="1100" y="570" font-family="'Inter', sans-serif" font-size="19" fill="#94a3b8">• Attenuates conducted spikes on power cords.</text>

  <!-- Footer -->
  <rect x="80" y="765" width="1440" height="70" rx="12" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="800" y="808" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#38bdf8" font-weight="600" text-anchor="middle">
    ★ EMC (Electromagnetic Compatibility): Devices work together seamlessly without disturbing each other.
  </text>
</svg>