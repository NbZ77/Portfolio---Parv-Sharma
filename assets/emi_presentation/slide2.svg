<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <rect x="80" y="60" width="1440" height="4" fill="url(#accent)"/>
  <text x="80" y="115" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#00d4ff" font-weight="bold" letter-spacing="3">ELECTROMAGNETIC THEORY &amp; INTERFERENCE · SLIDE 2 OF 5</text>
  <text x="80" y="185" font-family="'Space Grotesk', sans-serif" font-size="60" fill="#ffffff" font-weight="800">Sources of EMI</text>
  <text x="540" y="185" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#94a3b8" font-weight="500">— Where noise originates</text>

  <!-- 3 Sources Cards -->
  <!-- 1. Inside Circuits -->
  <rect x="80" y="240" width="460" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <circle cx="160" cy="320" r="40" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="142" y="302" width="36" height="36" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="135" y1="310" x2="142" y2="310" stroke="#38bdf8" stroke-width="3"/>
  <line x1="135" y1="330" x2="142" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <line x1="178" y1="310" x2="185" y2="310" stroke="#38bdf8" stroke-width="3"/>
  <line x1="178" y1="330" x2="185" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <text x="220" y="325" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#ffffff" font-weight="700">Inside Circuits</text>
  <text x="120" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#38bdf8" font-weight="600">Random Internal Changes</text>
  <text x="120" y="445" font-family="'Inter', sans-serif" font-size="19" fill="#cbd5e1">Random changes inside the components of a circuit.</text>
  <rect x="110" y="520" width="400" height="150" rx="12" fill="rgba(6,11,23,0.8)" stroke="rgba(56,189,248,0.2)"/>
  <text x="130" y="560" font-family="'Inter', sans-serif" font-size="18" fill="#94a3b8">Key Examples:</text>
  <text x="130" y="600" font-family="'Inter', sans-serif" font-size="20" fill="#00d4ff" font-weight="600">• Thermal Noise (Johnson)</text>
  <text x="130" y="635" font-family="'Inter', sans-serif" font-size="20" fill="#00d4ff" font-weight="600">• Shot Noise (carrier barrier)</text>

  <!-- 2. Man-Made -->
  <rect x="570" y="240" width="460" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <circle cx="650" cy="320" r="40" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="2"/>
  <path d="M635 335 L635 315 L648 325 L648 315 L665 328 L665 335 Z" fill="none" stroke="#00d4ff" stroke-width="2.5"/>
  <text x="710" y="325" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#ffffff" font-weight="700">Man-Made</text>
  <text x="610" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#00d4ff" font-weight="600">Equipment &amp; Technology</text>
  <text x="610" y="445" font-family="'Inter', sans-serif" font-size="19" fill="#cbd5e1">Noise created by human devices and switching systems.</text>
  <rect x="600" y="520" width="400" height="150" rx="12" fill="rgba(6,11,23,0.8)" stroke="rgba(0,212,255,0.2)"/>
  <text x="620" y="560" font-family="'Inter', sans-serif" font-size="18" fill="#94a3b8">Key Examples:</text>
  <text x="620" y="595" font-family="'Inter', sans-serif" font-size="19" fill="#38bdf8">• Electric Motors &amp; Relays</text>
  <text x="620" y="625" font-family="'Inter', sans-serif" font-size="19" fill="#38bdf8">• Power Switches &amp; Inverters</text>
  <text x="620" y="655" font-family="'Inter', sans-serif" font-size="19" fill="#38bdf8">• Computers &amp; Transmitters</text>

  <!-- 3. Natural -->
  <rect x="1060" y="240" width="460" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>
  <circle cx="1140" cy="320" r="40" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="2"/>
  <path d="M1142 300 L1128 322 L1140 322 L1136 340 L1152 316 L1140 316 Z" fill="#f59e0b"/>
  <text x="1200" y="325" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#ffffff" font-weight="700">Natural</text>
  <text x="1100" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#f59e0b" font-weight="600">Environmental Events</text>
  <text x="1100" y="445" font-family="'Inter', sans-serif" font-size="19" fill="#cbd5e1">Noise caused by natural phenomena in the atmosphere.</text>
  <rect x="1090" y="520" width="400" height="150" rx="12" fill="rgba(6,11,23,0.8)" stroke="rgba(245,158,11,0.2)"/>
  <text x="1110" y="560" font-family="'Inter', sans-serif" font-size="18" fill="#94a3b8">Key Examples:</text>
  <text x="1110" y="600" font-family="'Inter', sans-serif" font-size="20" fill="#fbbf24" font-weight="600">• Atmospheric Lightning Discharge</text>
  <text x="1110" y="635" font-family="'Inter', sans-serif" font-size="20" fill="#fbbf24" font-weight="600">• Solar Flares &amp; Sunspots</text>

  <!-- Footer -->
  <rect x="80" y="765" width="1440" height="70" rx="12" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="800" y="808" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#38bdf8" font-weight="600" text-anchor="middle">
    ★ CORE PRINCIPLE: Noise cannot be removed, but interference can.
  </text>
</svg>