<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <rect x="80" y="60" width="1440" height="4" fill="url(#accent)"/>
  <text x="80" y="115" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#00d4ff" font-weight="bold" letter-spacing="3">ELECTROMAGNETIC THEORY &amp; INTERFERENCE · SLIDE 3 OF 5</text>
  <text x="80" y="185" font-family="'Space Grotesk', sans-serif" font-size="60" fill="#ffffff" font-weight="800">Types of EMI by Cause</text>
  <text x="750" y="185" font-family="'Space Grotesk', sans-serif" font-size="30" fill="#94a3b8" font-weight="500">— Intrasystem vs Intersystem</text>

  <!-- Intrasystem EMI -->
  <rect x="80" y="240" width="700" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="2"/>
  <rect x="120" y="280" width="80" height="80" rx="16" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2"/>
  <path d="M145 305 L175 305 L175 335 L145 335 Z" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="160" cy="320" r="6" fill="#38bdf8"/>
  <text x="230" y="325" font-family="'Space Grotesk', sans-serif" font-size="34" fill="#ffffff" font-weight="700">Intrasystem EMI</text>
  <text x="230" y="358" font-family="'Inter', sans-serif" font-size="18" fill="#38bdf8">Same System Boundary</text>
  
  <rect x="120" y="390" width="620" height="110" rx="12" fill="rgba(6,11,23,0.7)"/>
  <text x="145" y="435" font-family="'Inter', sans-serif" font-size="22" fill="#f1f5f9" font-weight="600">• The noise starts inside the SAME system.</text>
  <text x="145" y="475" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• Both the emitter and victim share the same enclosure or PCB.</text>

  <rect x="120" y="530" width="620" height="150" rx="12" fill="rgba(6,11,23,0.7)"/>
  <text x="145" y="570" font-family="'Inter', sans-serif" font-size="19" fill="#94a3b8">Common Examples:</text>
  <text x="145" y="610" font-family="'Inter', sans-serif" font-size="20" fill="#38bdf8">• Switch-mode power supply ripple reaching sensitive ADC</text>
  <text x="145" y="645" font-family="'Inter', sans-serif" font-size="20" fill="#38bdf8">• High-speed digital clock traces coupling into analog lines</text>

  <!-- Intersystem EMI -->
  <rect x="820" y="240" width="700" height="480" rx="20" fill="rgba(13,22,40,0.8)" stroke="rgba(0,212,255,0.3)" stroke-width="2"/>
  <rect x="860" y="280" width="80" height="80" rx="16" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="2"/>
  <path d="M885 330 A 25 25 0 0 1 915 300 M885 340 A 35 35 0 0 1 925 300" stroke="#00d4ff" stroke-width="3" fill="none"/>
  <circle cx="890" cy="335" r="4" fill="#00d4ff"/>
  <text x="970" y="325" font-family="'Space Grotesk', sans-serif" font-size="34" fill="#ffffff" font-weight="700">Intersystem EMI</text>
  <text x="970" y="358" font-family="'Inter', sans-serif" font-size="18" fill="#00d4ff">Different External Systems</text>

  <rect x="860" y="390" width="620" height="110" rx="12" fill="rgba(6,11,23,0.7)"/>
  <text x="885" y="435" font-family="'Inter', sans-serif" font-size="22" fill="#f1f5f9" font-weight="600">• The noise comes from OUTSIDE, from another system.</text>
  <text x="885" y="475" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">• The emitter and the victim are in completely separate equipment.</text>

  <rect x="860" y="530" width="620" height="150" rx="12" fill="rgba(6,11,23,0.7)"/>
  <text x="885" y="570" font-family="'Inter', sans-serif" font-size="19" fill="#94a3b8">Common Examples:</text>
  <text x="885" y="610" font-family="'Inter', sans-serif" font-size="20" fill="#00d4ff">• Cellular tower transmission leaking into audio amplifiers</text>
  <text x="885" y="645" font-family="'Inter', sans-serif" font-size="20" fill="#00d4ff">• Industrial arc welder inducing voltage spikes on facility grid</text>

  <!-- Footer -->
  <rect x="80" y="765" width="1440" height="70" rx="12" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="800" y="808" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#38bdf8" font-weight="600" text-anchor="middle">
    ★ RESOLUTION: Both can be controlled by good design: Grounding, Shielding, and Filtering.
  </text>
</svg>